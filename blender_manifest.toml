schema_version = "1.0.0"

id = "divinity2"
version = "0.3.0"
name = "Divinity II"
tagline = "Import Divinity II: Ego Draconis models and regions"
maintainer = "divinity2-blender contributors"
type = "add-on"

website = "https://github.com/ygalsk/divinity2-blender"

tags = ["Import-Export"]

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]

# The NIF reader is generated from the NifTools project's format
# specification and vendored under vendor/nifgen.
copyright = [
  "2026 divinity2-blender contributors",
  "2005 NIF File Format Library and Tools contributors",
]

[permissions]
files = "Read the unpacked game from disk"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "/.claude/",
  "/.gitignore",
  "/CLAUDE.md",
]
